<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Старая Библиотека - Каталог книг</title>
    <style>
        body {
            font-family: 'Times New Roman', serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5dc;
            color: #333;
        }
        .header {
            background: #8B4513;
            color: white;
            padding: 20px;
            text-align: center;
            border: 2px solid #654321;
        }
        .menu {
            background: #DEB887;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #8B4513;
        }
        .book-list {
            background: white;
            padding: 15px;
            border: 1px solid #ccc;
            margin: 10px 0;
            min-height: 200px;
        }
        .book-item {
            padding: 10px;
            border-bottom: 1px dotted #8B4513;
            display: flex;
            justify-content: space-between;
        }
        .book-title {
            font-weight: bold;
        }
        .book-author {
            color: #666;
            font-style: italic;
        }
        .search-box {
            background: #F0E68C;
            padding: 15px;
            margin: 15px 0;
            border: 2px dashed #8B4513;
        }
        button {
            background: #8B4513;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }
        button:hover {
            background: #A0522D;
        }
        .marquee {
            background: #FFEBCD;
            padding: 5px;
            border: 1px solid #8B4513;
            margin: 10px 0;
        }
        .counter {
            background: #FFF8DC;
            padding: 10px;
            border: 1px solid #ccc;
            margin: 10px 0;
            font-size: 12px;
        }
        .search-results {
            margin-top: 10px;
            font-size: 14px;
        }
        input[type="text"] {
            padding: 8px;
            width: 300px;
            margin-right: 10px;
        }
        .loading {
            color: #8B4513;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📚 Старая Библиотека им. Л.Н. Толстого</h1>
        <p>Основана в 1998 году | Книг в каталоге: <span id="totalBookCount">0</span></p>
    </div>

    <div class="menu">
        <strong>Меню:</strong> 
        <a href="#" onclick="openMainPage(event)">Главная</a> |
        <a href="#" onclick="restoreBooks(event)">Восстановить библиотеку</a>
    </div>

    <div class="marquee">
        <marquee behavior="scroll" direction="left">
            🎉 Специальное предложение: Все книги Достоевского со скидкой 20%!
        </marquee>
    </div>

    <div class="search-box">
        <h3>🔍 Поиск по каталогу</h3>
        <input type="text" id="searchInput" placeholder="Введите название книги или автора...">
        <button onclick="searchBooks()">Искать</button>
        
        <div class="search-results" id="searchResults">
            Введите запрос и нажмите кнопку поиска
        </div>
    </div>

    <div class="book-list">
        <h2>📖 Книги в библиотеке:</h2>
        <div id="booksContainer"></div>
    </div>

    <div class="counter">
        <div>Посещений: <span id="visitCount">1</span></div>
        <div>Сегодня: <span id="currentDate"></span></div>
    </div>

    <script>
        const booksUrl = 'http://localhost:3000/books';
        let books;

        function initLibrary() {
            searchBooks();
            updateTotalBookCount(books);
            setVisitsCounter();
            setCurrentDate();
        }

        function setVisitsCounter() {
            if (localStorage.getItem('visits')) {
                const visits = parseInt(localStorage.getItem('visits')) + 1;
                localStorage.setItem('visits', visits);
                document.getElementById('visitCount').textContent = visits;
            } else {
                localStorage.setItem('visits', 1);
                document.getElementById('visitCount').textContent = 1;
            }
        }

        function setCurrentDate() {
            document.getElementById('currentDate').textContent = new Date().toLocaleDateString('ru-RU');
        }

        function renderBooksAndUpdateCount(books) {
            renderBooks(books);
            updateTotalBookCount(books);
        }

        function renderBooks(books) {
            const container = document.getElementById('booksContainer');
            if (books.length === 0) {
                container.innerHTML = '<div class="book-item">В библиотеке нет книг</div>';
                return;
            }
            
            container.innerHTML = books.map((book) => `
                <div class="book-item">
                    <div>
                        <span class="book-title">«${book.title}»</span> 
                        - <span class="book-author">${book.author}</span>
                        <span style="color: #888; font-size: 12px;"> (${book.year})</span>
                    </div>
                    <button onclick="removeBook(${book.id})">Удалить</button>
                </div>
            `).join('');
        }

        function updateTotalBookCount(books) {
            document.getElementById('totalBookCount').textContent = books.length;
        }

        function searchBooks() {
            setResult('<span class="loading">🔎 Выполняется поиск...</span>');

            const query = getQuery();
            books = search(query);
            renderBooks(books);
            const result = query ? `Найдено книг: ${books.length} по запросу "${query}"` : "";
            setResult(result);
        }

        function search(query) {
            const xhr = new XMLHttpRequest();
            let url = booksUrl;

            if (query) {
                const params = new URLSearchParams({
                    title: query,
                    author: query,
                    year: query,
                });
                url = `${url}?${params.toString()}`
            }

            xhr.open('GET', url, false); // false в третьем аргументе указывает на то, что данный запрос является синхронным
            xhr.send();
            return JSON.parse(xhr.response);
        }

        function getQuery() {
            return document.getElementById('searchInput').value.trim();
        }

        function setResult(result) {
            document.getElementById('searchResults').innerHTML = result;
        }

        function removeBook(id) {
            const xhr = new XMLHttpRequest();
            xhr.open('DELETE', `${booksUrl}/${id}`, false);
            xhr.send();
            if (xhr.status === 204) {
                books = books.filter((book) => book.id !== String(id));
                renderBooksAndUpdateCount(books);
            }
        }

        function openMainPage(event) {
            event.preventDefault();
            books = search();
            renderBooks(books);
            document.getElementById('searchInput').value = '';
            setResult('');
        }

        function restoreBooks(event) {
            event.preventDefault();
            const xhr = new XMLHttpRequest();
            xhr.open('POST', `${booksUrl}/reset`, false);
            xhr.send();
            books = JSON.parse(xhr.response);
            renderBooksAndUpdateCount(books);
        }

        window.onload = initLibrary;
    </script>
</body>
</html>
